name: Python checks
on:
  # Trigger the workflow on push to the main branch
  push:
    branches:
      - main
  # Trigger the workflow on pull request to the main branch
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Install dependencies
        run: |
          pipx install poetry && poetry install
      - name: Lint with ruff
        run: |
          # stop the build if there are Python syntax errors or undefined names
          poetry run ruff check --select=E9,F63,F7,F82
          # exit-zero treats all errors as warnings.
          poetry run ruff check --exit-zero
      - name: Check formatting with black
        uses: psf/black@stable
        with:
          src: ". tests/"
          options: "--check --verbose"
      - name: Start Redis ACL test service
        run: |
          docker run --detach --name redis-acl --publish 6379:6379 \
            redis@sha256:bd999b5cfee25fb24b8320a31fddbd69f462df44c8138c66e369582937beebc0 \
            redis-server --save '' --appendonly no \
            --user default off \
            --user linden_app on '>sdk-test-password' '~*' '&*' '+@all'
          for attempt in {1..30}; do
            if docker exec redis-acl redis-cli \
              --user linden_app --pass sdk-test-password ping \
              | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          docker logs redis-acl
          exit 1
      - name: Run unit tests
        env:
          TEST_REDIS_URL: redis://linden_app:sdk-test-password@localhost:6379/0
          TEST_REDIS_ANONYMOUS_URL: redis://localhost:6379/0
        run: |
          poetry run pytest tests/
